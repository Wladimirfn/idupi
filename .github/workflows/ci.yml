# Quality gate: the repo carries hundreds of tests; these jobs make them a
# door, not a diary. App (gradle) unit tests are intentionally NOT here yet --
# they need an Android SDK on the runner; add that job when the project has
# a release cadence to protect.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    # The product targets Windows PCs: the capture/input helper is built from
    # //go:build windows sources and cannot compile anywhere else, so testing
    # the real routes on ubuntu would only prove 503s.
    runs-on: windows-latest
    # The whole loop runs in ~3 minutes locally; if a test deadlocks on the
    # runner this stops the job from hanging for hours and names the file.
    timeout-minutes: 20
    env:
      # loadToken() prefers this over the generated .idupi-token file.
      IDUPI_TOKEN: ci-local-token-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The screen routes compile the capture helper on first use; without a
      # toolchain they answer 503 and the integration tests rightly fail.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run each server test file
        run: |
          fail=0
          for f in idupi-server/test/*.test.mjs; do
            echo "::group::$f"
            timeout 180 node --test "$f" || { echo "::error::test file failed or hung: $f"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  go-helper-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: idupi-server/screen-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: idupi-server/screen-helper/go.mod
      - name: vet + test (windows-only build tags)
        run: |
          gofmt -l .
          go vet ./...
          go test ./...
